```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Budget Tracker</h1>

    <form>
        <h2>Add Expense</h2>

        <label for="expenseName">Expense Name</label>
        <input
            type="text"
            id="expenseName"
            name="expenseName"
            placeholder="Enter expense name"
        >

        <label for="amount">Amount</label>
        <input
            type="number"
            id="amount"
            name="amount"
            placeholder="Enter amount"
        >

        <label for="date">Date</label>
        <input
            type="date"
            id="date"
            name="date"
        >

        <button type="submit">Add Expense</button>
    </form>

    <h2>Expense Table</h2>

    <table>
        <thead>
            <tr>
                <th>Expense Name</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Food</td>
                <td>500</td>
                <td>2026-09-29</td>
            </tr>

            <tr>
                <td>Transport</td>
                <td>300</td>
                <td>2026-09-28</td>
            </tr>

            <tr>
                <td>Shopping</td>
                <td>1000</td>
                <td>2026-09-27</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
